# Sets one edge-function secret on the Supabase project, from a GitHub secret of
# the same name. Manual only. Only names on the list below can be set, so this
# cannot be used to overwrite the keys the platform itself runs on.
name: Set function secret
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Which secret'
        required: true
        type: choice
        options: [RESEND_API_KEY, FOLLOWUP_FROM]
permissions:
  contents: read
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Push the secret to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FOLLOWUP_FROM: ${{ secrets.FOLLOWUP_FROM }}
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          VALUE="${!NAME}"
          if [ -z "$VALUE" ]; then echo "::error::The GitHub secret $NAME is empty."; exit 1; fi
          body=$(jq -n --arg n "$NAME" --arg v "$VALUE" '[{name:$n,value:$v}]')
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/bhrhejpekmhbhwryjhgk/secrets" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
          echo "HTTP $code"
          [ "$code" -lt 300 ] || { cat /tmp/out; exit 1; }
          echo "Set $NAME."
